<!doctype html>
<!-- Rendered to public/og-image.png (1200x630) by scripts/generate-images.mjs. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Manrope';
        font-weight: 500;
        src: url('../../node_modules/@fontsource/manrope/files/manrope-latin-500-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Manrope';
        font-weight: 800;
        src: url('../../node_modules/@fontsource/manrope/files/manrope-latin-800-normal.woff2') format('woff2');
      }

      * { box-sizing: border-box; margin: 0; }

      body {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #fff;
        color: #111;
        font-family: 'Manrope', sans-serif;
      }

      .text {
        position: absolute;
        left: 72px;
        top: 50%;
        z-index: 2;
        transform: translateY(-50%);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 36px;
        padding: 12px 20px;
        border-radius: 999px;
        background: #fff;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
        font-size: 20px;
        font-weight: 500;
      }

      .dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #22c55e;
      }

      h1 {
        font-size: 104px;
        font-weight: 800;
        line-height: 0.98;
        letter-spacing: 0.01em;
      }

      .first {
        display: block;
        color: #fff;
        -webkit-text-stroke: 5px #111;
        paint-order: stroke fill;
      }

      .last {
        display: block;
      }

      .role {
        margin-top: 28px;
        color: #6b6b6b;
        font-size: 34px;
        font-weight: 500;
      }

      .photo {
        position: absolute;
        right: -40px;
        bottom: 0;
        z-index: 1;
        width: 540px;
        height: 600px;
        object-fit: cover;
        object-position: 50% 0;
        -webkit-mask-image: linear-gradient(to right, transparent, #000 18%);
        mask-image: linear-gradient(to right, transparent, #000 18%);
      }
    </style>
  </head>
  <body>
    <div class="text">
      <p class="status"><span class="dot"></span>Open to work &amp; collaborations</p>
      <h1><span class="first">DEEPAK</span><span class="last">KUSHWAHA</span></h1>
      <p class="role">Full Stack Developer</p>
    </div>
    <img class="photo" src="../../src/assets/images/deepak.png" alt="" />
  </body>
</html>
